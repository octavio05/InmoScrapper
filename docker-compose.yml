services:

  scraper:
    build:
      dockerfile: Dockerfile
      context: ./scraper
      args:
        - NODE_ENV=${NODE_ENV}
    container_name: scraper
    depends_on:
      # - mongodb
      - couchdb
    volumes:
      - ./scraper/logs:/app/logs
      - ./scraper/src:/app/src
      - ./scraper/screenshots:/app/screenshots
      - /app/node_modules
    security_opt:
      - seccomp:unconfined
    shm_size: "1gb"
    environment:
      - NODE_ENV=${NODE_ENV}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_PORT=${DB_PORT}
      - DB_HOST=${DB_HOST}
      - DB_NAME=${DB_NAME}

  scraper-view:
    build:
      context: ./scraper-view
      dockerfile: Dockerfile
      args:
        - NODE_ENV=${NODE_ENV}
    container_name: scraper-view
    ports:
      - "8080:80"
    depends_on:
      - couchdb

  couchdb:
    image: couchdb:3
    container_name: couchdb
    restart: always
    ports:
      - "${DB_PORT}:${DB_PORT}"
    environment:
      COUCHDB_USER: ${DB_USER}
      COUCHDB_PASSWORD: ${DB_PASSWORD}
    volumes:
      - couchdb_data:/opt/couchdb/data

volumes:
  couchdb_data:

